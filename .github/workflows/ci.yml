name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # Compile, test, then actually deploy to a local chain and play the game
  # through. The bindings the frontend compiles against are produced here, so
  # they always describe contracts that have just been proven to work.
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run coverage

      - name: Start a local chain
        run: |
          npx hardhat node > /tmp/hardhat-node.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
              http://127.0.0.1:8545 > /dev/null; then
              echo "chain is up"
              exit 0
            fi
            sleep 1
          done
          echo "chain did not start"; cat /tmp/hardhat-node.log; exit 1

      - name: Deploy
        run: npm run deploy:local

      - name: Deployment health check
        run: npm run check:local

      # Walks a fresh wallet through the whole journey. If the core loop breaks,
      # this fails even when every unit test still passes.
      - name: Full player journey
        run: npx hardhat run scripts/e2e-playthrough.js --network localhost

      - name: Export ABIs and addresses
        run: npm run export:abi

      - name: Chain logs on failure
        if: failure()
        run: cat /tmp/hardhat-node.log || true

      - name: Upload bindings
        uses: actions/upload-artifact@v4
        with:
          name: contract-bindings
          path: frontend/lib/generated/
          retention-days: 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Generated from the artifacts of the job above; never committed.
      - name: Download bindings
        uses: actions/download-artifact@v4
        with:
          name: contract-bindings
          path: frontend/lib/generated/

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_CHAIN_ID: '31337'

  server:
    name: Multiplayer server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      # The wire protocol is shared with the frontend and vendored into the
      # server tree. Drift between the two copies is a build failure.
      - name: Protocol is in sync
        working-directory: server
        run: node scripts/sync-protocol.js --check

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Test
        working-directory: server
        run: npm test

      - name: Build
        working-directory: server
        run: npm run build

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A cheap, targeted backstop. The deployer key is the one secret whose
      # leak would hand over ownership of every contract.
      - name: Scan for private keys and .env files
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::a .env file is committed"
            exit 1
          fi
          if git grep -nIE '(PRIVATE_KEY|SECRET_KEY)[[:space:]]*=[[:space:]]*.?0x[0-9a-fA-F]{64}' -- . ':!*.example'; then
            echo "::error::a private key appears to be committed"
            exit 1
          fi
          if git grep -nIE '\b0x[0-9a-fA-F]{64}\b' -- '*.ts' '*.tsx' '*.js' ':!*test*' ':!*.example'; then
            echo "::error::a 32-byte hex literal looks like a key"
            exit 1
          fi
          echo "no committed secrets found"
